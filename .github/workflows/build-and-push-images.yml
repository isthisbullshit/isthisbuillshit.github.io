name: Build And Push Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-and-push-images.yml"
      - "backend/**"
      - "bsDetector/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: isthisbullshit
  GAR_HOST: europe-docker.pkg.dev
  GAR_REPOSITORY: isthisbullshit-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target:
            build_args:
          - image_name: bsdetector
            context: ./bsDetector
            dockerfile: ./bsDetector/Dockerfile
            target: main
            build_args: MODEL_DIR=model

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate To Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set Up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry Authentication
        run: gcloud auth configure-docker ${{ env.GAR_HOST }} --quiet

      - id: meta
        name: Compute Docker Metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build And Push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
